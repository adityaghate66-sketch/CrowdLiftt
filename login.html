<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CrowdLift — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="login.css" />
  <style>
  </style>
</head>
<body>

  <div class="left-panel">
    <div class="left-bg"></div>
    <div class="left-content">
      <a href="home.html" class="left-logo">CrowdLift</a>
    </div>
    <div class="left-bottom">
      <div class="left-quote">Train <span>smarter</span>.<br/>Not harder.</div>
      <div class="left-sub">Real-time crowd tracking, personalized plans,<br/>and a full exercise library — all free.</div>
    </div>
  </div>

  <div class="right-panel">
    <div class="form-box">

      <div class="form-title">Welcome back</div>
      <div class="form-sub">Sign in to your CrowdLift account</div>

      <div class="form-group">
        <label class="form-label">Email address</label>
        <div class="input-wrap">
          <input type="email" id="loginEmail" class="form-input" placeholder="you@example.com" autocomplete="email" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-wrap">
          <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" autocomplete="current-password" />
          <button class="toggle-pass" id="togglePass" type="button">👁</button>
        </div>
      </div>

      <div class="error-msg" id="errorMsg">Invalid email or password. Try again.</div>

      <button class="btn-submit" id="loginBtn">Sign In →</button>

      <div class="divider">
        <div class="divider-line"></div>
        <div class="divider-text">New here?</div>
        <div class="divider-line"></div>
      </div>

      <div class="switch-row">
        Don't have an account? <a href="signup.html" class="switch-link">Create one free</a>
      </div>

    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
